# This is a basic workflow to help you get started with Actions

name: Build Game

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  buildLinux:
    runs-on: ubuntu-latest

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@main

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      # Runs a set of commands using the runners shell
      - name: Install libvlc
        run: sudo apt-get install -y libvlc-dev libvlccore-dev

      - name: Install lime dependencies
        run: sudo apt-get install libgl1-mesa-dev libglu1-mesa-dev g++ g++-multilib gcc-multilib libasound2-dev libx11-dev libxext-dev libxi-dev libxrandr-dev libxinerama-dev

      - name: Install Haxelib
        run: |
          haxelib setup ~/haxelib
          chmod +x ./build/install_libraries.sh
          ./build/install_libraries.sh
          haxelib git hxcpp https://github.com/HaxeFoundation/hxcpp
      - name: Create Version Tag
        run: echo "${{github.run_id}}" > VERSION
      - name: Compile Linux
        run: |
          cd $(haxelib libpath hxcpp)/tools/hxcpp
          haxe compile.hxml
          cd -
          haxelib --always run lime rebuild linux
          haxelib --always run lime setup
          haxelib --always run lime build Project.xml linux --app-version="4.0.0-${{ github.run_id}}"
      - name: Publish Linux Artifact
        uses: actions/upload-artifact@main
        with:
          name: linuxBuild
          path: "export/release/linux/bin"

  buildWindows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@main
      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Install Haxelib
        run: |
          haxelib setup C:/haxelib
          haxelib install hxcpp
          haxelib install lime 8.1.2
          haxelib install openfl 9.3.3
          haxelib install flixel 5.5.0
          haxelib install flixel-addons
          haxelib install flixel-ui
          haxelib install flixel-tools
          haxelib install hscript
          haxelib install jsonpatch
          haxelib install polymod
          git clone https://github.com/FunkinCrew/funkVis C:/haxelib/funkVis
          git clone https://github.com/HaxeGrig/grig.audio C:/haxelib/grig.audio
          git clone https://github.com/MAJigsaw77/hxvlc C:/haxelib/hxvlc
          git clone https://github.com/Dot-Stuff/flxanimate C:/haxelib/flxanimate
          git clone https://github.com/MAJigsaw77/scriptless-polymod C:/haxelib/scriptless-polymod
        shell: cmd

      - name: Compile
        run: |
          cd /d %GITHUB_WORKSPACE%
          haxelib run lime clean windows
          haxelib run lime build windows Project.xml -D fdn --app-version="4.0.0-%GITHUB_RUN_ID%"
        shell: cmd

      - name: Publish Artifact
        uses: actions/upload-artifact@main
        with:
          name: windowsBuild
          path: export/release/windows/bin

  buildMac:
    runs-on: macos-13

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@main

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7
      # Runs a set of commands using the runners shell
      - name: Install Haxelib
        run: |
          haxelib setup ~/haxelib
          chmod +x ./build/install_libraries.sh
          ./build/install_libraries.sh
          haxelib git hxcpp https://github.com/HaxeFoundation/hxcpp
      - name: Create Version Tag
        run: echo "${{github.run_id}}" > VERSION
      - name: Compile
        run: |
          cd $(haxelib libpath hxcpp)/tools/hxcpp
          haxe compile.hxml
          cd -
          haxelib --always run lime rebuild mac
          haxelib --always run lime setup
          haxelib --always run lime build mac --app-version="4.0.0-${{ github.run_id}}"
      - name: Publish Artifact
        uses: actions/upload-artifact@main
        with:
          name: macBuild
          path: export/release/macos/bin
