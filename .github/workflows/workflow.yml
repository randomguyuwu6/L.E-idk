# This is a basic workflow to help you get started with Actions

name: Build Game

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  buildLinux:
    runs-on: ubuntu-latest

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@main

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      # Runs a set of commands using the runners shell
      - name: Install libvlc
        run: sudo apt-get install -y libvlc-dev libvlccore-dev

      - name: Install lime dependencies
        run: sudo apt-get install libgl1-mesa-dev libglu1-mesa-dev g++ g++-multilib gcc-multilib libasound2-dev libx11-dev libxext-dev libxi-dev libxrandr-dev libxinerama-dev

      - name: Install Haxelib
        run: |
          haxelib setup ~/haxelib
          chmod +x ./build/install_libraries.sh
          ./build/install_libraries.sh
          haxelib git hxcpp https://github.com/HaxeFoundation/hxcpp
      - name: Create Version Tag
        run: echo "${{github.run_id}}" > VERSION
      - name: Compile Linux
        run: |
          cd $(haxelib libpath hxcpp)/tools/hxcpp
          haxe compile.hxml
          cd -
          haxelib --always run lime rebuild linux
          haxelib --always run lime setup
          haxelib --always run lime build Project.xml linux --app-version="4.0.0-${{ github.run_id}}"
      - name: Publish Linux Artifact
        uses: actions/upload-artifact@main
        with:
          name: linuxBuild
          path: "export/release/linux/bin"

  buildWindows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@main

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Install Haxelib
        env:
          HAXELIB_PATH: C:/haxelib
        run: |
          haxelib setup C:/haxelib
          haxelib install hxcpp
          haxelib install lime 8.1.2
          haxelib install openfl 9.3.3
          haxelib install flixel 5.5.0
          haxelib install flixel-addons
          haxelib install flixel-ui
          haxelib install flixel-tools
          haxelib install hscript
          haxelib install jsonpatch
          haxelib install polymod
          git clone https://github.com/FNF-CNE-Devs/hscript-improved C:/haxelib/hscript-improved
          git clone https://github.com/Vortex2Oblivion/scriptless-polymod C:/haxelib/scriptless-polymod
          git clone https://github.com/Vortex2Oblivion/flxanimate C:/haxelib/flxanimate
          git clone https://github.com/MAJigsaw77/hxdiscord_rpc C:/haxelib/hxdiscord_rpc
          git clone https://github.com/Leather128/linc_luajit.git C:/haxelib/linc_luajit
          git clone https://github.com/MAJigsaw77/hxvlc C:/haxelib/hxvlc
          git clone https://github.com/FunkinCrew/funkin.vis C:/haxelib/funkin.vis
          git clone https://github.com/HaxeGrig/grig.audio C:/haxelib/grig.audio
          git clone https://github.com/KadeDev/fnf-modcharting-tools C:/haxelib/modcharting
          git clone https://github.com/polybiusproxy/hxCodec C:/haxelib/hxCodec
          haxelib dev hscript C:/haxelib/hscript-improved
          haxelib dev scriptless-polymod C:/haxelib/scriptless-polymod
          haxelib dev flxanimate C:/haxelib/flxanimate
          haxelib dev hxdiscord_rpc C:/haxelib/hxdiscord_rpc
          haxelib dev linc_luajit C:/haxelib/linc_luajit
          haxelib dev hxvlc C:/haxelib/hxvlc
          haxelib dev funkin.vis C:/haxelib/funkin.vis
          haxelib dev grig.audio C:/haxelib/grig.audio
          haxelib dev modcharting C:/haxelib/modcharting
          haxelib dev hxCodec C:/haxelib/hxCodec
          haxelib run lime setup -y
          haxelib run lime setup flixel
        shell: cmd

      - name: Register Libraries
        run: |
          haxelib dev hscript C:/haxelib/hscript-improved/git
          haxelib dev modcharting C:/haxelib/modcharting/git
          haxelib dev flxanimate C:/haxelib/flxanimate/git
        shell: cmd

      - name: Create Version Tag
        run: echo "${{github.run_id}}" > VERSION

      - name: Compile
        run: |
          haxelib run lime build windows --app-version="4.0.0-${{ github.run_id}}"
        shell: cmd

      - name: Publish Artifact
        uses: actions/upload-artifact@main
        with:
          name: windowsBuild
          path: export/release/windows/bin

  buildMac:
    runs-on: macos-13

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@main

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7
      # Runs a set of commands using the runners shell
      - name: Install Haxelib
        run: |
          haxelib setup ~/haxelib
          chmod +x ./build/install_libraries.sh
          ./build/install_libraries.sh
          haxelib git hxcpp https://github.com/HaxeFoundation/hxcpp
      - name: Create Version Tag
        run: echo "${{github.run_id}}" > VERSION
      - name: Compile
        run: |
          cd $(haxelib libpath hxcpp)/tools/hxcpp
          haxe compile.hxml
          cd -
          haxelib --always run lime rebuild mac
          haxelib --always run lime setup
          haxelib --always run lime build mac --app-version="4.0.0-${{ github.run_id}}"
      - name: Publish Artifact
        uses: actions/upload-artifact@main
        with:
          name: macBuild
          path: export/release/macos/bin
